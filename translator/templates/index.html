<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMB Tarjimon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; border: none; }
        .btn-translate { background: #0d6efd; color: white; border-radius: 10px; padding: 12px; transition: 0.3s; }
        .btn-translate:hover { background: #0b5ed7; transform: translateY(-2px); }
        .result-box { background: #ffffff; border-left: 5px solid #0d6efd; min-height: 100px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="text-center mb-4">
                    <h1 class="fw-bold text-primary">SMB Translator</h1>
                    <p class="text-muted">Google Translate API orqali matnlarni tezkor tarjima qiling</p>
                </div>

                <div class="card shadow-lg p-4">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Matnni kiriting:</label>
                            <textarea name="text" class="form-control" rows="5" placeholder="Tarjima kerak bo'lgan so'zni yozing..." required>{{ original_text }}</textarea>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Qaysi tilga:</label>
                                <select name="language" class="form-select border-primary">
                                    <option value="uz">O'zbekcha</option>
                                    <option value="en">Inglizcha (English)</option>
                                    <option value="ru">Ruscha (Русский)</option>
                                    <option value="tr">Turkcha (Türkçe)</option>
                                    <option value="ko">Koreyscha (한국어)</option>
                                    <option value="de">Nemischa (Deutsch)</option>
                                    <option value="ar">Arabcha (العربية)</option>
                                    <option value="fr">Fransuzcha (Français)</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-translate w-100 fw-bold">Tarjima qilish</button>
                    </form>

                    {% if translated_text %}
                    <div class="mt-4">
                        <label class="form-label fw-semibold text-success">Natija:</label>
                        <div class="result-box p-3 shadow-sm rounded">
                            <p class="fs-5 mb-0">{{ translated_text }}</p>
                        </div>
                    </div>
                    {% endif %}
                </div>
                
                <p class="text-center mt-4 text-secondary small">© 2026 SMB Translator Project</p>
            </div>
        </div>
    </div>
</body>
</html>
